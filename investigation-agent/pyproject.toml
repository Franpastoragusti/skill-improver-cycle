[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "orders-investigation-agent"
version = "0.1.0"
description = "An orders investigator guided by a Markdown skill, with optional Code Mode."
requires-python = ">=3.13,<3.16"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic-ai-slim[mcp,openai]==2.66.0",
    "pydantic-ai-harness[codemode,skills]==0.66.0",
    "logfire==4.41.0",
]

[project.scripts]
investigate = "investigation_agent.cli:main"
check-mcp = "investigation_agent.connections:main"

[tool.hatch.build.targets.wheel]
packages = ["src/investigation_agent"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "fastmcp-slim[server]==4.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
