[project]
name = "pydantic-gurusup-demo"
version = "0.1.0"
description = "A small orders simulator for the Pydantic AI and GuruSup demo."
requires-python = ">=3.12"
dependencies = [
    "logfire==4.41.0",
    "pymongo>=4.10,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
